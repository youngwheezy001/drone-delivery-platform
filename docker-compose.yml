version: '3.8'

services:
  # 1. TACTICAL DATABASE NODE (POSTGRESQL)
  postgres:
    image: postgres:15-alpine
    container_name: drone_db
    environment:
      POSTGRES_USER: drone_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secure_uplink_key}
      POSTGRES_DB: drone_mission_control
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drone_admin -d drone_mission_control"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - drone_net

  # 2. SECTOR COMMAND API (FASTAPI)
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: drone_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://drone_admin:${POSTGRES_PASSWORD:-secure_uplink_key}@postgres:5432/drone_mission_control
      - SECRET_KEY=${SECRET_KEY:-tactical_secret_01}
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - drone_net

  # 3. MISSION CONTROL INTERFACE (NEXT.JS)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: drone_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    networks:
      - drone_net

networks:
  drone_net:
    driver: bridge

volumes:
  pgdata: